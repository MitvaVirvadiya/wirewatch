# Local environment = the lab bench. Mirrors Architecture A (ADR-0003) so
# experiments behave the same locally and on Railway. Usage: docker compose up --build
name: wirewatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wirewatch
      POSTGRES_PASSWORD: wirewatch
      POSTGRES_DB: wirewatch
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: local
      PORT: 3001
      DATABASE_URL: postgres://wirewatch:wirewatch@postgres:5432/wirewatch
      REDIS_URL: redis://redis:6379
      INGEST_HMAC_SECRET: dev-ingest-secret
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: dev-better-auth-secret-local-only
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["bun", "run", "apps/api/src/worker.ts"]
    environment:
      APP_ENV: local
      WORKER_PORT: 3002
      DATABASE_URL: postgres://wirewatch:wirewatch@postgres:5432/wirewatch
      REDIS_URL: redis://redis:6379
    ports: ["3002:3002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["3100:3100"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
